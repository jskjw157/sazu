name: clock-investigation
on:
  push:
    branches: [fix/solar-term-time-basis-20261022]
    paths: [.github/workflows/clock-investigation.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      - run: |
          python -m pip install -r requirements-dev.lock -r requirements-astro.lock pyerfa==2.0.1.5
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Explicit acquisition for isolated diagnostic only
        run: |
          set -euo pipefail
          curl --proto '=https' --fail --silent --show-error --max-time 90 --max-filesize 1048576 https://astro.kasi.re.kr/kor/almanac/solarTerms/download -o "$RUNNER_TEMP/kasi.txt"
          curl --proto '=https' --fail --silent --show-error --max-time 120 --max-filesize 67108864 https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp -o "$RUNNER_TEMP/de440s.bsp"
          echo "508761248c7d18eb1ca1bcb1fcace2ba29f3f511d085321ae1e633c74d8e9e34  $RUNNER_TEMP/kasi.txt" | sha256sum -c -
          echo "c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  $RUNNER_TEMP/de440s.bsp" | sha256sum -c -
      - name: Controlled variants and public-code snapshot; no upstream dataset publication
        run: |
          python - <<'PY'
          import json, os, warnings, hashlib, subprocess
          from pathlib import Path
          from datetime import UTC, datetime, timedelta
          from contextlib import closing
          import numpy as np
          import erfa
          from skyfield.api import Loader, load_file
          from skyfield import almanac, almanac_east_asia
          from skyfield.framelib import ecliptic_frame
          from tools.audit_official_terms import build_request
          from sazu.cli import _manifest
          from sazu.kasi_reference import parse_kasi_document, reference_events
          root=Path(os.environ['RUNNER_TEMP'])
          req=build_request(root/'kasi.txt',root/'de440s.bsp',datetime.now(UTC),1920,2050)
          doc=parse_kasi_document((root/'kasi.txt').read_bytes(),_manifest(req['reference_manifest']))
          refs={(e.event_year,e.kasi_id):e.instant_utc for e in reference_events(doc,1920,2050)}
          ts=Loader(str(root)).timescale(builtin=True)
          out={'production_authorized':False,'adopted':False,'variants':{},'warnings':[],
               'purpose':'Unfitted hypotheses. No source edits or relaxed thresholds.',
               'code_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}
          period=lambda y:'pre1960' if y<1960 else '1960-1971' if y<1972 else '1972-2025' if y<=2025 else '2026-2050'
          def record(name,y,n,delta):
              b=out['variants'].setdefault(name,{})
              s=b.setdefault(period(y),{'total':0,'matched':0,'min_delta':1e9,'max_delta':-1e9,'sum_delta':0,'mismatches':[]})
              s['total']+=1;s['matched']+=int(-30<=delta<30)
              s['min_delta']=min(s['min_delta'],delta);s['max_delta']=max(s['max_delta'],delta);s['sum_delta']+=delta
              if not -30<=delta<30:s['mismatches'].append({'year':y,'id':n,'delta_seconds':delta})
          with closing(load_file(str(root/'de440s.bsp'))) as eph:
              earth,sun=eph['earth'],eph['sun']
              def full_nutation(t):
                  _,lon,_=earth.at(t).observe(sun).apparent().frame_latlon(ecliptic_frame)
                  return (lon.radians//(2*np.pi/24)%24).astype(int)
              full_nutation.step_days=14.0
              for mode,f in [('2000B',almanac_east_asia.solar_terms(eph)),('2000A',full_nutation)]:
                  for y in range(1920,2051):
                      times,indices=almanac.find_discrete(ts.utc(y,1,1),ts.utc(y+1,1,1),f,epsilon=1e-8)
                      assert len(times)==24
                      for t,index in zip(times,indices):
                          n=((int(index)*15-315)%360)//15+1
                          r=refs[y,n];dt=t.utc_datetime();d=(dt-r).total_seconds()
                          record(mode+'-SkyfieldUTC',y,n,d)
                          record(mode+'-UT1-hypothesis',y,n,d+float(t.dut1))
                          if y>=1960:
                              with warnings.catch_warnings(record=True) as ws:
                                  warnings.simplefilter('always')
                                  a,b=erfa.tttai(float(t.whole),float(t.tt_fraction));u,v=erfa.taiutc(a,b)
                                  yy,mm,dd,hms=erfa.d2dtf('UTC',6,u,v)
                              c=datetime(int(yy),int(mm),int(dd),int(hms['h']),int(hms['m']),int(hms['s']),int(hms['f']),tzinfo=UTC)
                              record(mode+'-ERFAUTC',y,n,(c-r).total_seconds())
                              if ws and len(out['warnings'])<4:out['warnings'].append(str(ws[0].message))
          dest=root/'diagnostic-export';dest.mkdir()
          data=(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode()
          (dest/'clock-probe.json').write_bytes(data)
          print(json.dumps({k:{p:{a:b for a,b in s.items() if a!='mismatches'} for p,s in v.items()} for k,v in out['variants'].items()},ensure_ascii=False))
          subprocess.run(['git','archive','--format=tar','-o',str(dest/'source.tar'),'HEAD'],check=True)
          print('probe_sha256',hashlib.sha256(data).hexdigest())
          PY
          python -m pip download --no-deps --only-binary=:all: -d "$RUNNER_TEMP/diagnostic-export" pyerfa==2.0.1.5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clock-diagnostic
          path: ${{ runner.temp }}/diagnostic-export/
          retention-days: 7
          if-no-files-found: error
