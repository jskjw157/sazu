name: clock-investigation
on:
  push:
    branches: [fix/solar-term-clock-20261022]
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements-dev.lock -r requirements-astro.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: official-term-audit
          run-id: 39562263067
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - name: Acquire public JPL model only; KASI baseline is explicitly replayed evidence
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 120 --max-filesize 67108864 --retry 2 https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp -o "$RUNNER_TEMP/de440s.bsp"
          echo "c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  $RUNNER_TEMP/de440s.bsp" | sha256sum -c -
          echo "1d775590cab5d641429f12188043ebbfe8579b680a557eb727c2a22e119a8b82  $RUNNER_TEMP/baseline/official-audit.json" | sha256sum -c -
      - name: Replay exact candidate identity, then diagnose without adopting corrections
        run: |
          python - <<'PY'
          import os,json,statistics,hashlib
          from pathlib import Path
          from datetime import UTC,datetime,date,timedelta
          from sazu.contracts import SourceManifest
          from sazu.serde import canonical_json,digest
          from sazu.solar_terms import generate_terms
          from skyfield.api import load
          p=Path(os.environ['RUNNER_TEMP']); kernel=p/'de440s.bsp'
          b=(p/'baseline'/'official-audit.json').read_bytes(); baseline=json.loads(b)['reference_comparison']
          m=SourceManifest('jpl-de440s','JPL','DE440s','https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp', 'c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2',kernel.stat().st_size,datetime.now(UTC),date(1850,1,1),date(2149,1,1),'TDB','computed','unreviewed','https://naif.jpl.nasa.gov/naif/rules.html',('jpl-de440s',),'skyfield-local-v1')
          events=[e for y in range(1920,2051) for e in generate_terms(y,kernel,m)]
          ordered=sorted(events,key=lambda e:(e.event_year,e.kasi_id,canonical_json(e)))
          assert digest(ordered)==baseline['candidate_sha256'], 'Candidate identity changed: refuse evidence reconstruction'
          failed={(x['year'],x['kasi_id']):x['delta_seconds_from_display'] for x in baseline['mismatches']}
          ts=load.timescale(builtin=True); rows=[]
          for e in ordered:
              # For matched entries the original minute cell is uniquely determined.
              # Failed entries retain the original recorded delta, not a new reference fetch.
              rounded=(e.instant_utc+timedelta(seconds=30)).replace(second=0,microsecond=0)
              delta=failed.get((e.event_year,e.kasi_id),(e.instant_utc-rounded).total_seconds())
              t=ts.tt_jd(e.tt_jd)
              rows.append({'year':e.event_year,'term':e.kasi_id,'utc_delta':delta,'dut1':float(t.dut1),'delta_t':float(t.delta_t),'tt_jd':e.tt_jd})
          models={'utc':lambda r:r['utc_delta'],'ut1':lambda r:r['utc_delta']+r['dut1'],'utc_double_round':lambda r:r['utc_delta']+0.5,'ut1_double_round':lambda r:r['utc_delta']+r['dut1']+0.5}
          summaries={}
          for name,model in models.items():
              ds=[model(r) for r in rows]
              summaries[name]={'matched':sum(-30<=d<30 for d in ds),'min':min(ds),'max':max(ds),'mean':statistics.mean(ds),'negative_failures':sum(d < -30 for d in ds),'positive_failures':sum(d>=30 for d in ds)}
          result={'diagnostic_only':True,'production_authorized':False,'evidence_basis':'hash_verified_replay_of_prior_audit_not_new_official_acquisition','baseline_sha256':hashlib.sha256(b).hexdigest(),'candidate_sha256':digest(ordered),'summaries':summaries,'rows':rows}
          (p/'evidence'/'clock-probe.json').write_text(json.dumps(result,separators=(',',':')))
          print(json.dumps(summaries,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clock-investigation
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: error
