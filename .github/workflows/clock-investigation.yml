name: clock-repair-regression
on:
  pull_request:
  push:
    branches: [fix/solar-term-clock-20261022]
permissions:
  contents: read
concurrency:
  group: clock-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clock-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check src tests tools && python -m pytest -q
      - name: Explicit local ephemeris for integration; no publication
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --max-time 120 --max-filesize 67108864 --retry 2 \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp \
            -o "$RUNNER_TEMP/de440s.bsp"
          echo "c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  $RUNNER_TEMP/de440s.bsp" | sha256sum -c -
      - name: Real kernel and subprocess CLI, not a new KASI comparison
        env:
          SAZU_KERNEL: ${{ runner.temp }}/de440s.bsp
        run: python -m pytest -q tests/integration/test_skyfield_local.py
