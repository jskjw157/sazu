name: clock-dependency
on:
  push:
    branches: [fix/solar-term-clock-20261022]
permissions:
  contents: read
jobs:
  reference-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: |
          python -m pip download --no-deps --only-binary=:all: --dest "${{ runner.temp }}/wheels" pyerfa==2.0.1.5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clock-erfa-wheel
          path: ${{ runner.temp }}/wheels
          retention-days: 1
          if-no-files-found: error
