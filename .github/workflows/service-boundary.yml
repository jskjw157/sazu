name: service-boundary
on:
  push:
    branches: [feat/express-python-boundary-20261021]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Public source and dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle/repo/apps/api"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/bundle/repo"
          cd "$RUNNER_TEMP/bundle/repo/apps/api"
          printf '%s\n' '{"name":"@sazu/api","version":"0.1.0","private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --save-exact express@5 ajv@8 pg@8
          npm install --ignore-scripts --save-dev --save-exact typescript@5 @types/node@24 @types/express@5 @types/pg@8
          node --version > "$RUNNER_TEMP/bundle/node-version.txt"
          npm --version > "$RUNNER_TEMP/bundle/npm-version.txt"
          npm audit --json > "$RUNNER_TEMP/bundle/audit.json" || true
          cd "$RUNNER_TEMP/bundle"
          tar -czf "$RUNNER_TEMP/service-dev-bundle.tar.gz" repo node-version.txt npm-version.txt audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-dev-bundle
          path: ${{ runner.temp }}/service-dev-bundle.tar.gz
          retention-days: 1
          if-no-files-found: error
