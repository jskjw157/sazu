name: official-source-validation
on:
  push:
    branches: [feat/official-source-validation-20261021]
  pull_request:
    paths:
      - 'src/sazu/**'
      - 'tests/**'
      - 'tools/audit_official_terms.py'
      - 'requirements*.lock'
      - '.github/workflows/official-validation.yml'
permissions:
  contents: read
concurrency:
  group: official-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check src tests tools && python -m pytest -q
  reference-comparison:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements-dev.lock -r requirements-astro.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Explicit official acquisition, not a runtime dependency
        run: |
          set -euo pipefail
          date -u +ACQUIRED_AT=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_ENV"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 90 --max-filesize 1048576 --retry 2 https://astro.kasi.re.kr/kor/almanac/solarTerms/download -o "$RUNNER_TEMP/kasi.txt"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 120 --max-filesize 67108864 --retry 2 https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp -o "$RUNNER_TEMP/de440s.bsp"
          echo "508761248c7d18eb1ca1bcb1fcace2ba29f3f511d085321ae1e633c74d8e9e34  $RUNNER_TEMP/kasi.txt" | sha256sum -c -
          echo "c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  $RUNNER_TEMP/de440s.bsp" | sha256sum -c -
      - name: Every term in 1920-2050; mismatch is a failed numeric gate
        run: |
          python tools/audit_official_terms.py --kasi "$RUNNER_TEMP/kasi.txt" --kernel "$RUNNER_TEMP/de440s.bsp" --acquired-at "$ACQUIRED_AT" > "$RUNNER_TEMP/official-audit.json"
      - name: Publish only generated evidence, never upstream TXT or BSP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-term-audit
          path: ${{ runner.temp }}/official-audit.json
          retention-days: 30
          if-no-files-found: warn
      - name: Numerical result summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'official-audit.json'
          if not path.exists():
              print('BLOCKED: acquisition or execution failed; no numerical result')
          else:
              result=json.loads(path.read_text()); audit=result.get('reference_comparison',{})
              print(json.dumps({'status':result['status'],'matched':audit.get('matched'),'expected':audit.get('expected'),'mismatch_count':len(audit.get('mismatches',[])),'production_authorized':False}))
          PY
