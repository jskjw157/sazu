name: jpl-eop2-epoch-evidence
on:
  pull_request:
    paths:
      - 'tools/jpl_eop2_epoch_audit.py'
      - 'tests/test_jpl_eop2_epoch_audit.py'
      - '.github/workflows/jpl-eop2-epoch-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-eop2-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements-dev.lock -r requirements-astro.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: All core and EOP2 tests without network
        run: |
          python -m ruff check src tests tools
          python -m pytest -q
      - name: Resolve the official October-22 archival file, never a mutable latest link
        run: |
          python - <<'PY'
          import html.parser, os, urllib.request
          base='https://eop2-external.jpl.nasa.gov/eop2/'
          class Links(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      self.links += [v for k,v in attrs if k=='href' and v]
          with urllib.request.urlopen(base,timeout=35) as f:
              body=f.read(180000).decode('utf-8')
          links=Links();links.feed(body)
          candidates=[v for v in links.links
              if v.startswith('261022_') and v.endswith('-marge_eop2.long')
              and '/' not in v and '?' not in v]
          if len(candidates)!=1:
              raise SystemExit('BLOCKED: archived 2026-10-22 JPL EOP2 snapshot missing/ambiguous')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SAZU_EOP2_ARCHIVE_URL='+base+candidates[0]+'\n')
          print('Resolved unique archived JPL EOP2 filename:',candidates[0])
          PY
      - name: Acquire JPL EOP2 snapshot from verified archival endpoint
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --max-time 90 --max-filesize 6710886 --retry 1 \
            "$SAZU_EOP2_ARCHIVE_URL" -o "$RUNNER_TEMP/jpl-eop2.long"
          echo "ec0077f51f1cc7705265940f9dea7426996d38c06fd13f811e459eecb31d4525  $RUNNER_TEMP/jpl-eop2.long" | sha256sum -c -
      - name: Sample 20 archived TT instants using exact MJD TAI interpolation
        run: |
          python -m tools.jpl_eop2_epoch_audit \
            --eop "$RUNNER_TEMP/jpl-eop2.long" \
            --source-sha256 "ec0077f51f1cc7705265940f9dea7426996d38c06fd13f811e459eecb31d4525" \
            --epochs data/verification/modern_20_tt_epochs_20261023.json \
            --cases data/verification/modern_20_naoj_cases_20261023.json \
            --output "$RUNNER_TEMP/eop2-20-epoch-evidence.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jpl-eop2-20-epoch-summary-only
          path: ${{ runner.temp }}/eop2-20-epoch-evidence.json
          if-no-files-found: warn
          retention-days: 30
