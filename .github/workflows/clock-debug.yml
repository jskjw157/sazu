name: clock-revision
on:
  push:
    branches: [fix/solar-term-clock-20261021]
permissions:
  contents: read
concurrency:
  group: clock-revision-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m ruff check src tests tools
          python -m compileall -q src
          python -m pytest -q
  full-period-comparison:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Acquire unchanged public research sources; no raw data publication
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 90 --max-filesize 1048576 https://astro.kasi.re.kr/kor/almanac/solarTerms/download -o "$RUNNER_TEMP/kasi.txt"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 120 --max-filesize 67108864 https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp -o "$RUNNER_TEMP/de440s.bsp"
          echo "508761248c7d18eb1ca1bcb1fcace2ba29f3f511d085321ae1e633c74d8e9e34  $RUNNER_TEMP/kasi.txt" | sha256sum -c -
          echo "c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  $RUNNER_TEMP/de440s.bsp" | sha256sum -c -
      - name: Corrected clock audit; unresolved cases remain a failed gate
        run: python -m tools.audit_clock_revision --kasi "$RUNNER_TEMP/kasi.txt" --kernel "$RUNNER_TEMP/de440s.bsp" > "$RUNNER_TEMP/clock-revision.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clock-revision
          path: ${{ runner.temp }}/clock-revision.json
          retention-days: 30
      - name: Summary never changes the numerical gate
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib, json
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'clock-revision.json'
          if not p.exists() or not p.stat().st_size:
              raise SystemExit('BLOCKED: no numerical report')
          r=json.loads(p.read_text())
          print(json.dumps({'status':r['status'],'legacy':r['legacy'],'periods':r['periods'],
                'resolved_original_count':len(r['resolved_original_mismatch_keys']),
                'not_resolved_original_count':len(r['not_resolved_original_mismatch_keys']),
                'tt_roots_unchanged':r['tt_roots_unchanged'],'production_authorized':False},indent=2))
          PY
