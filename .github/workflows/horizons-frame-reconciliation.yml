name: horizons-frame-reconciliation
on:
  pull_request:
    paths:
      - 'tools/horizons_frame_reconciliation.py'
      - 'tests/test_horizons_frame_reconciliation.py'
      - 'data/verification/horizons_20_central_observations_20261023.json'
      - '.github/workflows/horizons-frame-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uncorrected-and-eop-limitation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements-dev.lock -r requirements-astro.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Offline tests, Ruff and source precision
        run: |
          python -m ruff check tools/horizons_frame_reconciliation.py tests/test_horizons_frame_reconciliation.py
          python -m pytest -q tests/test_horizons_frame_reconciliation.py
      - name: Acquire hash-pinned DE440s for research only
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --max-time 120 --max-filesize 67108864 --retry 2 \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp \
            -o "$RUNNER_TEMP/de440s.bsp"
          echo "c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  $RUNNER_TEMP/de440s.bsp" | sha256sum -c -
      - name: Compare IAU2000A B and uncorrected 1976/1980 frames
        run: |
          python -m tools.horizons_frame_reconciliation \
            --observations data/verification/horizons_20_central_observations_20261023.json \
            --references data/verification/modern_20_naoj_cases_20261023.json \
            --kernel "$RUNNER_TEMP/de440s.bsp" \
            --output "$RUNNER_TEMP/frame-reconciliation.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'frame-reconciliation.json').read_text())
          assert d['status']=='diagnostic_only' and d['production_authorized'] is False
          assert d['eop_corrections_applied'] is False and d['sample_count']==20
          print(json.dumps({'status':d['status'],'count':d['sample_count'],
               'statistics_arcsec':d['statistics_arcsec'],'production_authorized':False}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: uncorrected-iau76-80-frame-study
          path: ${{ runner.temp }}/frame-reconciliation.json
          if-no-files-found: warn
          retention-days: 30
