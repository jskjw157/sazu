name: horizons-term-research
on:
  pull_request:
    paths:
      - 'tools/horizons_term_probe.py'
      - 'tests/test_horizons_term_probe.py'
      - 'data/verification/modern_20_tt_epochs_20261023.json'
      - '.github/workflows/horizons-term-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-and-horizons:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements-dev.lock -r requirements-astro.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -q tests/test_horizons_term_probe.py
      - name: Explicit research kernel acquisition (verified hash, not published)
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --max-time 120 --max-filesize 67108864 --retry 2 \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp \
            -o "$RUNNER_TEMP/de440s.bsp"
          echo "c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  $RUNNER_TEMP/de440s.bsp" | sha256sum -c -
      - name: Compare Horizons ICRF vectors and non-identical apparent longitude conventions
        run: |
          python -m tools.horizons_term_probe \
            --epochs data/verification/modern_20_tt_epochs_20261023.json \
            --cases data/verification/modern_20_naoj_cases_20261023.json \
            --kernel "$RUNNER_TEMP/de440s.bsp" \
            --output "$RUNNER_TEMP/horizons-term-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: horizons-term-research
          path: ${{ runner.temp }}/horizons-term-report.json
          if-no-files-found: warn
          retention-days: 30
