name: horizons-term-research
on:
  pull_request:
    paths:
      - 'tools/horizons_term_probe.py'
      - 'tests/test_horizons_term_probe.py'
      - 'data/verification/modern_20_tt_epochs_20261023.json'
      - '.github/workflows/horizons-term-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-and-horizons:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements-dev.lock -r requirements-astro.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -q tests/test_horizons_term_probe.py
      - name: Explicit research kernel acquisition (verified hash, not published)
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --max-time 120 --max-filesize 67108864 --retry 2 \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp \
            -o "$RUNNER_TEMP/de440s.bsp"
          echo "c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2  $RUNNER_TEMP/de440s.bsp" | sha256sum -c -
      - name: Identify failing layer (bounded and secret-safe)
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tools import horizons_term_probe as h
          stage='validate TT evidence'
          try:
              e=h.load_epochs(Path('data/verification/modern_20_tt_epochs_20261023.json'),Path('data/verification/modern_20_naoj_cases_20261023.json'))
              print(stage,len(e),flush=True)
              stage='Skyfield with verified DE440s'
              local=h.compute_skyfield(e,Path(os.environ['RUNNER_TEMP'])/'de440s.bsp')
              print(stage,len(local),flush=True)
              stage='Horizons observer HTTP response'
              times=[v.tt_jd + o/86400 for v in e for o in (-120,0,120)]
              observer,sha=h.fetch_horizons(h.make_query('observer',times))
              print(stage,len(observer),sha,flush=True)
              stage='Horizons observer parser'
              lon=h.parse_observer(observer,times)
              print(stage,len(lon),flush=True)
              stage='Horizons ICRF vector HTTP response'
              vtimes=[v['tdb_jd'] for v in local]
              vectors,sha=h.fetch_horizons(h.make_query('vector',vtimes))
              print(stage,len(vectors),sha,flush=True)
              stage='Horizons vector parser'
              v=h.parse_vectors(vectors,vtimes)
              print(stage,len(v),flush=True)
          except Exception as error:
              print('BLOCKED AT',stage,type(error).__name__,str(error)[:180],flush=True)
              raise
          PY
      - name: Compare Horizons ICRF vectors and non-identical apparent longitude conventions
        run: |
          python -m tools.horizons_term_probe \
            --epochs data/verification/modern_20_tt_epochs_20261023.json \
            --cases data/verification/modern_20_naoj_cases_20261023.json \
            --kernel "$RUNNER_TEMP/de440s.bsp" \
            --output "$RUNNER_TEMP/horizons-term-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: horizons-term-research
          path: ${{ runner.temp }}/horizons-term-report.json
          if-no-files-found: warn
          retention-days: 30
