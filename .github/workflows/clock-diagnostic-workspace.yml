name: clock-diagnostic-workspace
on:
  push:
    branches: [feat/official-source-validation-20261021]
    paths: [.github/workflows/clock-diagnostic-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Export tracked code and pinned public Python tools only
        run: |
          mkdir -p "$RUNNER_TEMP/workspace/wheels"
          git archive --format=tar HEAD > "$RUNNER_TEMP/workspace/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/workspace/commit.txt"
          python -m pip download --only-binary=:all: -r requirements-dev.lock -r requirements-astro.lock -d "$RUNNER_TEMP/workspace/wheels"
          tar -czf "$RUNNER_TEMP/clock-workspace.tar.gz" -C "$RUNNER_TEMP/workspace" .
          sha256sum "$RUNNER_TEMP/clock-workspace.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clock-workspace
          path: ${{ runner.temp }}/clock-workspace.tar.gz
          retention-days: 1
          if-no-files-found: error
